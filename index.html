<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- This is what shows in the browser tab -->
  <title>Tim Brown</title>

  <style>
    /* CSS lives here — it controls how things look */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fafaf7;
      color: #2b2b2b;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      padding: 60px 24px;
    }

    main {
      max-width: 560px;
      width: 100%;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 4px;
    }

    .tagline {
      color: #777;
      margin-bottom: 32px;
    }

    p {
      margin-bottom: 16px;
    }

    h2 {
      font-size: 1.1rem;
      margin: 32px 0 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #999;
    }

    .links a {
      display: block;
      padding: 12px 16px;
      margin-bottom: 8px;
      background: #fff;
      border: 1px solid #e5e5e0;
      border-radius: 8px;
      text-decoration: none;
      color: #2b2b2b;
      transition: border-color 0.15s;
    }

    .links a:hover {
      border-color: #2b2b2b;
    }

    footer {
      margin-top: 48px;
      font-size: 0.85rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <!-- HTML lives here — it's the content of the page -->
  <main>
    <h1>Tim Brown</h1>
    <p class="tagline">Learning to build things on the web.</p>

    <p>
      Hi, I'm Tim. This is my corner of the internet — built from scratch
      while learning how websites actually work, from a file on my laptop
      to a live server.
    </p>

    <h2>Find me</h2>
    <div class="links">
      <!-- Edit these: swap in your real links, add or remove as you like -->
      <a href="mailto:iamtimbrown@gmail.com">Email me</a>
      <a href="https://https://www.smh.com.au/">Sydney Morning Herald</a>
    </div>

    <footer>
      Built by hand · 2026
    </footer>
  </main>
</body>
</html>
